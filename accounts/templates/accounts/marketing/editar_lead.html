{% extends "accounts/base.html" %}

{% block title %}
Editar Lead
{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <form method="post">

        {% csrf_token %}

        <div class="card-header bg-warning">

            <h5 class="mb-0">

                <i class="bi bi-pencil-square me-2"></i>

                Editar Lead

            </h5>

        </div>

        <div class="card-body">

            <div class="row">

                {% for field in form %}

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            {{ field.label }}

                        </label>

                        {{ field }}

                        {% if field.errors %}

                            <div class="text-danger small">

                                {{ field.errors }}

                            </div>

                        {% endif %}

                    </div>

                {% endfor %}

            </div>

        </div>

        <div class="card-footer text-end">

            <a href="{% url 'leads' %}"
               class="btn btn-secondary">

                Cancelar

            </a>

            <button
                type="submit"
                class="btn btn-warning">

                <i class="bi bi-check-circle"></i>

                Salvar Alterações

            </button>

        </div>

    </form>

</div>

{% endblock %}
