<div class="operacional-grid">

    <!-- RECEBER -->

    <a href="{% url 'contas_receber' %}" class="operacional-card">

        <div class="operacional-icon green">
            <i class="bi bi-cash-coin"></i>
        </div>

        <div class="operacional-info">

            <div class="operacional-title">
                Receber Hoje
            </div>

            <div class="operacional-value">
                R$ {{ receber_hoje|floatformat:2 }}
            </div>

            <div class="operacional-subtitle">
                {{ receber_hoje_qtd }} conta{{ receber_hoje_qtd|pluralize:"s" }}
            </div>

        </div>

    </a>

    <!-- PAGAR -->

    <a href="{% url 'contas_pagar' %}" class="operacional-card">

        <div class="operacional-icon red">
            <i class="bi bi-wallet2"></i>
        </div>

        <div class="operacional-info">

            <div class="operacional-title">
                Pagar Hoje
            </div>

            <div class="operacional-value">
                R$ {{ pagar_hoje|floatformat:2 }}
            </div>

            <div class="operacional-subtitle">
                {{ pagar_hoje_qtd }} conta{{ pagar_hoje_qtd|pluralize:"s" }}
            </div>

        </div>

    </a>

    <!-- ESTOQUE -->

    <a href="{% url 'estoque' %}" class="operacional-card">

        <div class="operacional-icon orange">
            <i class="bi bi-box-seam-fill"></i>
        </div>

        <div class="operacional-info">

            <div class="operacional-title">
                Estoque
            </div>

            <div class="operacional-value">
                {{ produtos_criticos }}
            </div>

            <div class="operacional-subtitle">
                Produtos críticos
            </div>

        </div>

    </a>

</div>
