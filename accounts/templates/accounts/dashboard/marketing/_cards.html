<style>

/* =========================================
DASHBOARD MARKETING
========================================= */

.stats-card{

    border:none;
    border-radius:18px;

    box-shadow:0 4px 16px rgba(0,0,0,.08);

    transition:.30s ease;

    overflow:hidden;

    position:relative;

    background:#fff;

}

.stats-card::before{

    content:"";

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:4px;

}

.stats-card:hover{

    transform:translateY(-5px);

    box-shadow:0 12px 30px rgba(0,0,0,.12);

}

/* =========================================
ÍCONES
========================================= */

.stats-icon{

    width:54px;
    height:54px;

    border-radius:16px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:24px;

    color:#fff;

    margin-bottom:16px;

}

.stats-icon.blue{

    background:linear-gradient(135deg,#3b82f6,#2563eb);

}

.stats-icon.green{

    background:linear-gradient(135deg,#10b981,#059669);

}

.stats-icon.orange{

    background:linear-gradient(135deg,#f97316,#ea580c);

}

.stats-icon.purple{

    background:linear-gradient(135deg,#8b5cf6,#7c3aed);

}

/* =========================================
BARRAS SUPERIORES
========================================= */

.stats-card.border-blue::before{

    background:#2563eb;

}

.stats-card.border-green::before{

    background:#10b981;

}

.stats-card.border-orange::before{

    background:#ea580c;

}

.stats-card.border-purple::before{

    background:#7c3aed;

}

/* =========================================
TEXTOS
========================================= */

.stats-content h6{

    font-size:16px;

    font-weight:600;

    color:#374151;

    margin-bottom:10px;

}

.stats-content h3{

    font-size:28px;

    font-weight:700;

    color:#111827;

    margin-bottom:4px;

    line-height:1.1;

}

.stats-content small{

    font-size:13px;

    color:#6b7280;

}

</style>


<div class="row">

    <!-- NOVOS PACIENTES -->

    <div class="col-xl-3 col-md-6 mb-4">

        <div class="card dashboard-card stats-card border-blue">

            <div class="card-body">

                <div class="stats-icon blue">

                    <i class="bi bi-person-plus-fill"></i>

                </div>

                <div class="stats-content">

                    <h6>Novos Pacientes</h6>

                    <h3>

                        {{ novos_pacientes|default:"0" }}

                    </h3>

                    <small>

                        Cadastrados neste mês

                    </small>

                </div>

            </div>

        </div>

    </div>


    <!-- LEADS -->

    <div class="col-xl-3 col-md-6 mb-4">

        <div class="card dashboard-card stats-card border-green">

            <div class="card-body">

                <div class="stats-icon green">

                    <i class="bi bi-bullseye"></i>

                </div>

                <div class="stats-content">

                    <h6>Leads Gerados</h6>

                    <h3>

                        {{ leads_mes|default:"0" }}

                    </h3>

                    <small>

                        Captação do mês

                    </small>

                </div>

            </div>

        </div>

    </div>


    <!-- AGENDAMENTOS -->

<div class="col-xl-3 col-md-6 mb-4">

    <div class="card dashboard-card stats-card border-orange">

        <div class="card-body">

            <div class="stats-icon orange">

                <i class="bi bi-check2-circle"></i>

            </div>

            <div class="stats-content">

                <h6>Agendamentos</h6>

                <h3>

                    {{ agendamentos_mes|default:"0" }}

                </h3>

                <small>

                    Agendados neste mês

                </small>

            </div>

        </div>

    </div>

</div>


    <!-- TAXA -->

    <div class="col-xl-3 col-md-6 mb-4">

        <div class="card dashboard-card stats-card border-purple">

            <div class="card-body">

                <div class="stats-icon purple">

                    <i class="bi bi-graph-up-arrow"></i>

                </div>

                <div class="stats-content">

                    <h6>Taxa de Conversão</h6>

                    <h3>

                        {{ taxa_conversao|default:"0" }}%

                    </h3>

                    <small>

                        Conversão dos leads

                    </small>

                </div>

            </div>

        </div>

    </div>

</div>
